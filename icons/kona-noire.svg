<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100" role="img" aria-label="SUV électrique noir">
  <!-- Conçue pour rester lisible en petit (84 px dans la fiche véhicule) :
       formes simples, couleurs pleines, pas de dégradé fin ni de détail
       qui disparaît au rendu réduit. Demande explicite du 2026-10-25. -->

  <ellipse cx="100" cy="88" rx="86" ry="5" fill="#000000" opacity="0.18"/>

  <!-- Carrosserie : silhouette SUV nette, passages de roue inclus dans le
       contour (pas de calque séparé qui disparaîtrait en petit) -->
  <path d="M18,66
           L18,58 C18,50 24,44 32,43
           L48,40
           L62,24 C66,19 73,16 80,16
           L140,16 C147,16 153,19 157,25
           L168,42
           C178,44 185,51 185,60
           L185,66
           C185,70 182,73 178,73
           L170,73
           C170,62 161,53 150,53
           C139,53 130,62 130,73
           L70,73
           C70,62 61,53 50,53
           C39,53 30,62 30,73
           L22,73
           C19,73 18,70 18,66 Z"
        fill="#0c0d0f"/>

  <!-- Vitrage, bloc unique clair sur fond sombre : reste lisible en petit -->
  <path d="M66,41 L78,25 C80,22 84,20 88,20 L134,20 C138,20 141,22 143,25 L154,41 Z"
        fill="#7a93ab"/>
  <rect x="108" y="22" width="3" height="19" fill="#0c0d0f"/>

  <!-- Barre de toit -->
  <rect x="78" y="17" width="58" height="3" rx="1.5" fill="#0c0d0f"/>

  <!-- Phare + feu, gros aplats francs pour rester visibles en petit -->
  <circle cx="176" cy="48" r="6" fill="#ffffff"/>
  <rect x="20" y="46" width="7" height="9" rx="1.5" fill="#d6372f"/>

  <!-- Roues : grands disques pleins, pas de rayons fins -->
  <circle cx="50" cy="73" r="20" fill="#0c0d0f"/>
  <circle cx="50" cy="73" r="10" fill="#aab1b9"/>
  <circle cx="50" cy="73" r="3.5" fill="#0c0d0f"/>

  <circle cx="150" cy="73" r="20" fill="#0c0d0f"/>
  <circle cx="150" cy="73" r="10" fill="#aab1b9"/>
  <circle cx="150" cy="73" r="3.5" fill="#0c0d0f"/>
</svg>
